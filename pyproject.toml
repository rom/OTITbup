[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otitbup"
version = "0.1.0"
description = "OT and IT backup tool: versioned git backups of PLC, RTU, gateway and network equipment configurations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
ssh = ["netmiko>=4.3"]
sftp = ["paramiko>=3.0"]
siemens = ["python-snap7>=1.3"]
rockwell = ["pycomm3>=1.2"]
opcua = ["asyncua>=1.0"]
beckhoff = ["pyads>=3.3"]
crypto = ["cryptography>=42.0"]
ldap = ["ldap3>=2.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "cryptography>=42.0"]

[project.scripts]
otitbup = "otitbup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic, stdlib-first project: pyflakes (F), pycodestyle (E/W),
# import order (I), bugbear (B), and pyupgrade (UP). Kept deliberately
# focused so the gate stays meaningful rather than noisy.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced hard
    "B008",   # false positives on argparse/default factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
