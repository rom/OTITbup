# Example otitbup configuration.
# This file is the inventory source of truth — keep it in git.

data_dir: ./data          # backup git repository (relative to this file)

retention:                # global defaults; override per site/zone/device
  keep_versions: 30       # keep offloaded content of the newest N backups
  keep_days: 365          # ...and of any backup newer than this (OR'd)
  large_file_threshold: 1048576   # artifacts >= 1 MiB go to the blob
                                  # store; 0 keeps everything in git
  # Enforce with `otitbup retention --apply` (dry run without --apply).

secrets:
  backend: plainfile      # plainfile | encryptedfile (needs otitbup[crypto])
  path: secrets.yml       # relative to data_dir's parent
  # For encrypted secrets:
  #   otitbup secrets genkey --out otitbup.key
  #   otitbup secrets encrypt secrets.yml secrets.enc --key-file otitbup.key
  # backend: encryptedfile
  # path: secrets.enc
  # key_file: otitbup.key   # or set OTITBUP_KEY in the service environment
  #
  # HashiCorp Vault (KV v2):
  # backend: vault
  # url: https://vault.plant.local:8200
  # mount: secret
  # path_prefix: otitbup       # secret path: secret/data/otitbup/<name>
  # token_file: vault.token    # or set VAULT_TOKEN
  #
  # CyberArk Central Credential Provider:
  # backend: cyberark
  # url: https://ccp.plant.local
  # app_id: otitbup
  # safe: OT-Backup
  # object_prefix: otitbup-    # object looked up: otitbup-<device cred name>

git:
  push: false             # set true + remote to mirror off-appliance
  # remote: git@gitlab.plant.local:ot/backups.git

webui:
  host: 127.0.0.1
  port: 8080
  # Generate with: otitbup passwd
  # auth:
  #   username: admin
  #   password_hash: pbkdf2_sha256$600000$...$...
  # Generate a self-signed pair with: otitbup certgen (or use CA-issued PEMs)
  # tls:
  #   cert_file: webui-cert.pem    # relative to this config file
  #   key_file: webui-key.pem

alerts:
  stale_days: 7           # alert if no successful backup in N days (0 = off)
  webhooks: []
  # syslog:
  #   address: 10.0.0.1
  #   port: 514
  # email:
  #   smtp_host: mail.plant.local
  #   from: otitbup@plant.local
  #   to: [ot-team@example.com]

policy:                   # config compliance checks (otitbup policy / UI)
  # disable: [no-snmpv1v2]         # silence a built-in rule
  rules: []
  #  - id: require-ntp
  #    description: no NTP server configured
  #    severity: low
  #    absent: "ntp server"        # ABSENCE is a finding; use `match` for presence

reports:                  # scheduled compliance reports (from the daemon)
  # interval: 7d                    # omit to disable scheduling
  # period_days: 30
  # out: compliance-report.html

sites:
  - name: plant-a
    # retention: {keep_days: 730}     # site-level override
    zones:
      - name: cell-1
        maintenance_window: "18:00-06:00"   # only poll outside production
        max_concurrent: 1                    # sequential within this zone
        # retention: {keep_versions: 10}    # zone-level override
        devices:
          - name: plc-01
            driver: siemens_s7              # needs otitbup[siemens]
            address: 10.20.0.10
            schedule: 12h
            options:
              rack: 0
              slot: 2                       # S7-300/400: 2, S7-1200/1500: usually 1
              # upload_blocks: false        # metadata + fingerprint only
          - name: plc-01-exports
            driver: generic_file
            schedule: 1h
            options:
              path: /srv/exports/plc-01     # engineer-exported TIA projects
              patterns: ["**/*.zap*", "**/*.ap*"]

      - name: cell-2
        maintenance_window: "18:00-06:00"
        devices:
          - name: plc-02
            driver: rockwell_enip           # needs otitbup[rockwell]
            address: 10.20.0.20
            schedule: 12h
            options:
              slot: 0
          - name: plc-03
            driver: schneider_modbus        # stdlib-only, no extra needed
            address: 10.20.0.30
            schedule: 12h
            options:
              unit_id: 255

      - name: cell-3
        devices:
          - name: plc-04
            driver: mitsubishi_mc           # MELSEC Q/L/iQ (stdlib)
            address: 10.20.0.40
            schedule: 12h
            options:
              port: 5007                    # match the CPU's MC port

          - name: plc-05
            driver: omron_fins              # Omron CJ/CS/CP/NJ/NX (stdlib)
            address: 10.20.0.50
            schedule: 12h

          - name: plc-06
            driver: beckhoff_ads            # needs otitbup[beckhoff] + ADS route
            address: 10.20.0.60
            schedule: 12h

          - name: plc-07-ua
            driver: generic_opcua           # needs otitbup[opcua]
            address: 10.20.0.70
            schedule: 12h
            # credentials: plc-07-ua        # if the server requires login

          - name: plc-08
            driver: wago_pfc                # needs otitbup[sftp]; fetches
            address: 10.20.0.80             # the Codesys runtime dirs
            schedule: 12h
            credentials: plc-08

          - name: plc-09
            driver: phoenix_plcnext         # /opt/plcnext/projects via SFTP
            address: 10.20.0.90
            schedule: 12h
            credentials: plc-09

          - name: plc-10
            driver: ge_pacsystems           # EtherNet/IP identity (stdlib)
            address: 10.20.0.100
            schedule: 12h

      - name: rtus
        max_concurrent: 1
        devices:
          - name: rtu-01
            driver: generic_dnp3            # any DNP3 outstation (stdlib)
            address: 10.30.0.10
            schedule: 1d
            options:
              outstation: 1
              master: 3

          - name: rtac-01
            driver: sel_terminal            # SEL RTAC / relays over SSH
            address: 10.30.0.20
            schedule: 1d
            credentials: rtac-01

          - name: sicam-01
            driver: siemens_sicam           # SICAM A8000 web endpoints
            address: 10.30.0.30
            schedule: 1d
            credentials: sicam-01
            options:
              urls:
                - "https://{address}/diag/parameters"  # your firmware's paths
              verify_tls: false

          - name: rtu520-01
            driver: abb_rtu520              # ABB RTU500 series web server
            address: 10.30.0.40
            schedule: 1d
            credentials: rtu520-01
            options:
              urls:
                - "https://{address}/status"           # your firmware's paths
              verify_tls: false

      - name: network
        max_concurrent: 2
        devices:
          # Vendor profiles preset the netmiko device type, the commands to
          # capture, and volatile-line scrubbing. Everything is overridable
          # per device via options (device_type, commands, port, scrub).
          - name: core-sw-01
            driver: cisco_ios               # Cisco IOS / IOS-XE
            address: 10.10.0.1
            schedule: 1h
            credentials: core-sw-01

          - name: cell1-sw-01
            driver: siemens_scalance        # SCALANCE X/XB/XC/XR
            address: 10.10.0.2
            schedule: 1h
            credentials: cell1-sw-01

          - name: ring-sw-01
            driver: ruggedcom_ros           # RUGGEDCOM ROS (config.csv)
            address: 10.10.0.3
            schedule: 1h
            credentials: ring-sw-01

          - name: edge-rtr-01
            driver: ruggedcom_rox           # RUGGEDCOM ROX II (RX1500, ...)
            address: 10.10.0.4
            schedule: 1h
            credentials: edge-rtr-01

          - name: cell2-sw-01
            driver: moxa_switch             # Moxa EDS/EDR managed switches
            address: 10.10.0.5
            schedule: 1h
            credentials: cell2-sw-01

          - name: cab3-sw-01
            driver: westermo_weos           # Westermo Lynx/Viper/RedFox
            address: 10.10.0.6
            schedule: 1h
            credentials: cab3-sw-01

          - name: remote-gw-01
            driver: westermo_merlin         # Westermo Merlin 4G/5G routers
            address: 10.10.0.7
            schedule: 4h
            credentials: remote-gw-01

          - name: nport-01
            driver: moxa_nport              # Moxa NPort serial-to-ethernet
            address: 10.10.0.40             # (web-managed: HTTP export)
            schedule: 1d
            credentials: nport-01
            options:
              urls:
                - "http://{address}/ConfigExport.txt"  # your model's export path

          - name: hall2-sw-01
            driver: hirschmann_hios         # Hirschmann/Belden BOBCAT, GREYHOUND, RSP
            address: 10.10.0.8
            schedule: 1h
            credentials: hall2-sw-01

          - name: hall2-sw-02
            driver: advantech_switch        # Advantech EKI
            address: 10.10.0.9
            schedule: 1h
            credentials: hall2-sw-02

          - name: office-sw-01
            driver: netgear_switch          # Netgear M4300/M4250/ProSAFE
            address: 10.10.0.10
            schedule: 1h
            credentials: office-sw-01

          - name: line4-sw-01
            driver: omron_switch            # Omron industrial switches
            address: 10.10.0.11
            schedule: 1h
            credentials: line4-sw-01

          - name: other-device
            driver: generic_ssh             # anything netmiko can reach
            address: 10.10.0.99
            schedule: 1d
            credentials: other-device
            options:
              device_type: cisco_ios
              commands:
                - show running-config
                - show version

      - name: perimeter
        max_concurrent: 1
        devices:
          - name: plant-fw-01
            driver: cisco_asa               # needs enable_secret in secrets
            address: 10.10.1.1
            schedule: 4h
            credentials: plant-fw-01

          - name: ot-fw-01
            driver: hirschmann_eagle        # EAGLE20/30/40 industrial firewall
            address: 10.10.1.2
            schedule: 4h
            credentials: ot-fw-01

          - name: cell-fw-01
            driver: moxa_edr                # EDR-810/G903/G9010 secure router
            address: 10.10.1.3
            schedule: 4h
            credentials: cell-fw-01

          - name: remote-rtr-01
            driver: advantech_router        # ICR cellular router (Linux shell)
            address: 10.10.1.4
            schedule: 1d
            credentials: remote-rtr-01
